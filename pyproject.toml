[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contribradar"
version = "0.1.0"
description = "Find and prioritize meaningful open-source contribution opportunities."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ContribRadar Contributors"}]
keywords = ["open-source", "github", "contributors", "cli", "developer-tools", "maintenance"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
contribradar = "contribradar.cli:main"

[tool.setuptools.packages.find]
include = ["contribradar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
